<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Minang Traditional Tanjak / Crown Accent on Top -->
  <path d="M 20 22 C 24 13, 32 8, 32 8 C 32 8, 40 13, 44 22 Z" fill="url(#flameGrad)" stroke="url(#goldGrad)" stroke-width="1.2" filter="url(#glow)"/>
  <path d="M 23 20 Q 32 12 41 20" stroke="#FEF08A" stroke-width="1" fill="none"/>

  <!-- Golden Lightning Bolt Motif (PLN Energy) -->
  <path d="M 34 16 L 24 33 L 31 33 L 28 48 L 42 30 L 34 30 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- "SI APIN" Text Badge at Bottom -->
  <rect x="8" y="47" width="48" height="11" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="0.75"/>
  <text x="32" y="55.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">SI APIN</text>
</svg>
